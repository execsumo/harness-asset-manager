name: CI

on:
  push:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - LICENSE
      - assets/**
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - LICENSE
      - assets/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, separately-named gate on the core-harness commitment (Claude, Codex,
  # Antigravity, Cursor). It runs the declaration ratchet on its own so a core-harness
  # regression shows up as its own red check in seconds, instead of being buried in the
  # full backend suite. See harness/contracts.py::SupportTier.
  core-harness-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Core harness support-tier gate
        run: python -m unittest tests.unit.test_harness_support_tiers -v

  backend-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip setuptools
          ./.venv/bin/pip install -r requirements.txt

      - name: Install dev dependencies
        run: ./.venv/bin/pip install -r requirements-dev.txt

      - name: Backend lint
        run: ./.venv/bin/ruff check harness_asset_manager tests scripts

      - name: Python type check
        run: ./.venv/bin/pyright

      - name: Python dependency audit
        run: |
          ./.venv/bin/pip install pip-audit
          ./.venv/bin/pip-audit

      - name: Backend compatibility tests
        run: bash scripts/test_backend.sh

  frontend-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:check

      - name: Check version sync
        run: ./.venv/bin/python scripts/sync_version.py --check

      - name: Check release target resolver
        run: npm run release-targets:check

      - name: Frontend lint
        run: npm run lint:frontend

      - name: Frontend typecheck
        run: npm run typecheck

      - name: OpenAPI codegen drift check
        run: npm run codegen:check

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

  package-smoke:
    name: package-smoke-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch'
    needs:
      - backend-compat
      - frontend-validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            homebrew: true
          - target: darwin-x64
            runner: macos-15-intel
            homebrew: true
          - target: linux-x64
            runner: ubuntu-latest
            homebrew: false
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            homebrew: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install build dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements.txt .[build]
          npm ci

      - name: Build release artifact
        run: ./.venv/bin/python scripts/build_release.py

      - name: Validate packaged binary
        run: |
          VERSION="$(cat harness_asset_manager/VERSION)"
          ARTIFACT="$(find .artifacts/release -name '*${{ matrix.target }}.tar.gz' -print -quit)"
          ./.venv/bin/python scripts/validate_release_artifact.py --artifact "$ARTIFACT" --version "$VERSION"

      - name: Validate npm wrapper with local artifact
        run: |
          ARTIFACT="$(find .artifacts/release -name '*${{ matrix.target }}.tar.gz' -print -quit)"
          bash scripts/validate_npm_wrapper.sh "$ARTIFACT"

      - name: Validate Homebrew formula install smoke
        if: matrix.homebrew
        run: |
          VERSION="$(cat harness_asset_manager/VERSION)"
          ARTIFACT="$(find .artifacts/release -name '*${{ matrix.target }}.tar.gz' -print -quit)"
          bash scripts/validate_homebrew_formula.sh "$VERSION" "$ARTIFACT"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-smoke-${{ matrix.target }}
          path: .artifacts/release/*
