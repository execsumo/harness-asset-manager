[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-asset-manager"
dynamic = ["version"]
description = "Local app and browser UI for universal asset management across agent harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.135,<0.142",
  "tomli-w>=1.2,<2",
  "ruamel.yaml>=0.18,<0.20",
  "uvicorn>=0.44,<0.53",
  "certifi>=2024.8.30,<2027",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
harness-asset-manager = "harness_asset_manager.cli:main"

[project.urls]
Homepage = "https://github.com/execsumo/harness-asset-manager"
Repository = "https://github.com/execsumo/harness-asset-manager"
Issues = "https://github.com/execsumo/harness-asset-manager/issues"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "harness_asset_manager.__version__" }

[tool.setuptools.packages.find]
include = ["harness_asset_manager*"]

[tool.setuptools.package-data]
harness_asset_manager = ["VERSION", "data/templates/*"]

# Static analysis -------------------------------------------------------------
# Ruff is the backend lint gate (per RECOMMENDATIONS.md §1.2). We adopt the
# highest-value, lowest-noise pair first and keep it GREEN on adoption:
#   * ``I``  -- import sorting (applied across the tree; enforced from here on)
#   * ``F``  -- pyflakes (redefinitions, unused names, etc.)
# Codes in ``ignore`` are the current baseline of pre-existing findings kept
# green on adoption; each is a deliberate "fix-later". Removing a code from
# ``ignore`` means the codebase now satisfies it and it is enforced — the list
# is meant to shrink over time. Ruff now covers the application, tests, and
# release/support scripts. Broadening ``select`` (E/W/UP/B/...) is the next
# follow-up once the deferred cleanup lands.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["I", "F"]
ignore = [
    "F821",  # existing dynamic-name findings; Pyright catches undefined names in its gate.
    "F841",  # intentionally-unused locals (mostly test readability).
]
